<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Illegal Operations</title>
    <link rel="stylesheet" href="illegal.css">
</head>
<body>
    <!-- ILLEGAL BACKGROUND - KOMPLETT EIGENSTÄNDIG -->
    <div id="illegal-background" class="illegal-bg"></div>
    <div id="illegal-overlay" class="illegal-bg-overlay"></div>
    <!-- ILLEGALES BOSS MENU (Tablet NPC) -->
    <div id="illegal-boss-menu" class="illegal-container" style="display: none;">
        <div class="illegal-header">
            <h1>ILLEGAL OPERATIONS</h1>
            <button class="close-btn" onclick="closeIllegalMenu()">✕</button>
        </div>
        
        <div class="illegal-content">
            <!-- Schwarze Kasse & Stats Overview -->
            <div class="illegal-stats-grid">
                <div class="black-cash-display">
                    <div class="cash-label">SCHWARZE KASSE</div>
                    <div class="cash-amount">$<span id="blackCash">0</span></div>
                </div>
                <div class="stat-box">
                    <div class="stat-label">ARMY VEHICLES</div>
                    <div class="stat-value" id="armyVehicleCount">0</div>
                </div>
                <div class="stat-box">
                    <div class="stat-label">HELIPADS</div>
                    <div class="stat-value">3</div>
                </div>
            </div>
            
            <!-- Quick Actions Grid -->
            <div class="illegal-actions">
                <button class="illegal-btn" onclick="openIllegalShopFromMenu()">
                    <span class="btn-icon">🎖️</span>
                    <span class="btn-label">ARMY VEHICLES</span>
                    <span class="btn-desc">Kaufe Military Helikopter</span>
                </button>
                <button class="illegal-btn" onclick="openIllegalGarageFromMenu()">
                    <span class="btn-icon">🚁</span>
                    <span class="btn-label">ILLEGAL GARAGE</span>
                    <span class="btn-desc">Bestand & Fahrzeuge verwalten</span>
                </button>
                <button class="illegal-btn" onclick="manageIllegalOperations()">
                    <span class="btn-icon">⚡</span>
                    <span class="btn-label">OPERATIONS</span>
                    <span class="btn-desc">Aktivitäten & Missionen</span>
                </button>
                <button class="illegal-btn" onclick="viewIllegalTransactions()">
                    <span class="btn-icon">💸</span>
                    <span class="btn-label">TRANSAKTIONEN</span>
                    <span class="btn-desc">Finanzhistorie einsehen</span>
                </button>
            </div>
        </div>
    </div>
    
    <!-- ILLEGALER SHOP (Army Helis) -->
    <div id="illegal-shop" class="illegal-container" style="display: none;">
        <div class="illegal-header">
            <h1>ARMY VEHICLE SHOP</h1>
            <button class="close-btn" onclick="closeIllegalMenu()">✕</button>
        </div>
        
        <div class="illegal-content">
            <!-- Shop Balance Display -->
            <div class="shop-balance-bar">
                <div class="balance-info">
                    <span class="balance-label">VERFÜGBAR:</span>
                    <span class="balance-amount">$<span id="shopBalance">0</span></span>
                </div>
                <div class="shop-warning">
                    ⚠️ MILITARY GRADE VEHICLES - HOHE HEAT
                </div>
            </div>
            
            <!-- Category Tabs -->
            <div class="shop-categories">
                <button class="category-btn active" onclick="filterShopCategory('all')">ALLE</button>
                <button class="category-btn" onclick="filterShopCategory('transport')">TRANSPORT</button>
                <button class="category-btn" onclick="filterShopCategory('attack')">ATTACK</button>
            </div>
            
            <!-- Vehicle Grid -->
            <div id="illegal-vehicle-list" class="vehicle-grid">
                <!-- Wird dynamisch gefüllt -->
            </div>
        </div>
    </div>
    
    <!-- ILLEGALE GARAGE (Helipad NPCs) -->
    <div id="illegal-garage" class="illegal-container" style="display: none;">
        <div class="illegal-header">
            <h1>ILLEGAL GARAGE</h1>
            <button class="close-btn" onclick="closeIllegalMenu()">✕</button>
        </div>
        
        <div class="illegal-content">
            <!-- Garage Info Header -->
            <div class="garage-info">
                <div class="helipad-info-card">
                    <div class="helipad-name" id="helipadName">HELIPAD 1</div>
                    <div class="helipad-status">
                        <span class="status-label">BESTAND:</span>
                        <span class="status-value" id="vehicleCount">0</span> Fahrzeuge
                    </div>
                </div>
            </div>
            
            <!-- Vehicle Inventory List -->
            <div class="garage-section-label">FAHRZEUG-BESTAND</div>
            <div id="illegal-garage-vehicles" class="vehicle-list">
                <!-- Wird dynamisch gefüllt -->
            </div>
            
            <!-- Garage Actions -->
            <div class="garage-actions">
                <button class="illegal-btn secondary" onclick="storeIllegalVehicle()">
                    <span class="btn-icon">📦</span>
                    FAHRZEUG EINPARKEN
                </button>
                <button class="illegal-btn secondary" onclick="refreshGarage()">
                    <span class="btn-icon">🔄</span>
                    BESTAND AKTUALISIEREN
                </button>
            </div>
        </div>
    </div>
    
    <!-- ILLEGALES MANAGEMENT -->
    <div id="illegal-management" class="illegal-container" style="display: none;">
        <div class="illegal-header">
            <h1>ILLEGAL OPERATIONS MANAGEMENT</h1>
            <button class="close-btn" onclick="closeIllegalMenu()">✕</button>
        </div>
        
        <div class="illegal-content">
            <div class="operations-stats">
                <div class="stat-box">
                    <div class="stat-label">HEAT LEVEL</div>
                    <div class="stat-value" id="heatLevel">0%</div>
                </div>
                <div class="stat-box">
                    <div class="stat-label">OPERATIONS</div>
                    <div class="stat-value" id="operationsCount">0</div>
                </div>
                <div class="stat-box">
                    <div class="stat-label">PROFIT</div>
                    <div class="stat-value">$<span id="totalProfit">0</span></div>
                </div>
            </div>
            
            <div class="operations-list" id="operationsList">
                <!-- Wird dynamisch gefüllt -->
            </div>
        </div>
    </div>
    
    <script src="https://code.jquery.com/jquery-3.6.0.min.js" integrity="sha256-/xUj+3OJU5yExlq6GSYGSHk7tPXikynS7ogEvDej/m4=" crossorigin="anonymous"></script>
    <script src="illegal.js"></script>
</body>
</html>
